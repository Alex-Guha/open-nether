org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parameter names and javadocs on top of Mojang's names: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the NeoForge version: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
# The major version of FML
loader_version_range=[1,)

## Mod properties

# Lowercase, [a-z][a-z0-9_]{1,63}; the MODID constant of the @Mod class
mod_id=opennether
mod_name=Open Nether
# SPDX id. Our code is PolyForm Shield 1.0.0: LICENSE, NOTICE, LICENSING.md
mod_license=PolyForm-Shield-1.0.0
# x.y.z on main; x.y.z.N-<branch> for a test jar (docs: CLAUDE.md "Branches, versions, releases"). After a change,
# the notes go under "Unreleased Changes" in the newest changelog/ file (changelog/README.md)
mod_version=0.1.0
# The base package of the sources
mod_group_id=com.alexguha.opennether
mod_authors=Alex Guha
mod_description=Opens the Nether's roof and reshapes its terrain for players arriving from above, by airship through Immersive Portals: Aeronautics' dimension stack.
issue_tracker_url=https://github.com/Alex-Guha/open-nether/issues

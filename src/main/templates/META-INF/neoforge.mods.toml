# Expanded by build.gradle (generateModMetadata) from gradle.properties. Spec: https://docs.neoforged.net/docs/gettingstarted/modfiles
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="${mod_id}.png"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Mods that replace the nether's terrain (its noise settings) as we do: only one terrain can win
[[dependencies.${mod_id}]]
    modId="incendium"
    type="incompatible"
    reason="Incendium replaces the Nether's terrain, as Open Nether does; only one of them can shape it."
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="amplified_nether"
    type="incompatible"
    reason="Amplified Nether replaces the Nether's terrain, as Open Nether does; only one of them can shape it."
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="netherexp"
    type="discouraged"
    reason="With its default config, Jaden's Nether Expansion replaces the Nether's terrain and biome source, overriding Open Nether. Set netherWorldGenOverhaul and improvedNetherBiomeSource to false in its config (and removeNetherNoodleCaves to false to keep the Nether's cave tunnels)."
    versionRange="*"
    ordering="NONE"
    side="BOTH"

